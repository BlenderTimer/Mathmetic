name: Build Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish installers to GitHub Release?'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build installers
        run: npm run make
      
      - name: Rename Windows installer
        if: matrix.os == 'windows-latest'
        run: |
          mv out/make/squirrel.windows/x64/*.exe out/make/mathmetic-${{ github.ref_name }}.exe

      - name: Rename macOS installer
        if: matrix.os == 'macos-latest'
        run: |
          mv out/make/*.dmg out/make/mathmetic-${{ github.ref_name }}.dmg

      - name: Rename Linux installers
        if: matrix.os == 'ubuntu-latest'
        run: |
          shopt -s nullglob
          for f in out/make/deb/x64/*.deb; do
            mv "$f" "out/make/mathmetic-${{ github.ref_name }}.deb"
          done

          for f in out/make/rpm/x64/*.rpm; do
            mv "$f" "out/make/mathmetic-${{ github.ref_name }}.rpm"
          done

      - name: Set release mode
        shell: bash
        run: |
          echo "RELEASE=false" >> $GITHUB_ENV
          if [ "${{ github.event.inputs.release }}" == "true" ]; then
            echo "RELEASE=true" >> $GITHUB_ENV
          fi
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "RELEASE=true" >> $GITHUB_ENV
          fi

      - name: Create GitHub release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Mathmetic v${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            out/make/*.exe
            out/make/*.dmg
            out/make/*.deb
            out/make/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}