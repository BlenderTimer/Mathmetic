name: Build Installers
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish installers to GitHub Release?'
        required: false
        default: 'true'
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build installers
        run: npm run make

      - name: Set VERSION
        id: set-version
        shell: bash
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Rename Windows installer
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mv out/make/squirrel.windows/x64/*.exe \
             "out/make/mathmetic-v${{ steps.set-version.outputs.VERSION }}.exe"

      - name: Rename macOS installer
        if: matrix.os == 'macos-latest'
        run: |
          mv out/make/*.dmg \
             "out/make/mathmetic-v${{ steps.set-version.outputs.VERSION }}.dmg"

      - name: Rename Linux installers
        if: matrix.os == 'ubuntu-latest'
        run: |
          shopt -s nullglob
          for f in out/make/deb/x64/*.deb; do
            mv "$f" "out/make/mathmetic-v${{ steps.set-version.outputs.VERSION }}.deb"
          done
          for f in out/make/rpm/x64/*.rpm; do
            mv "$f" "out/make/mathmetic-v${{ steps.set-version.outputs.VERSION }}.rpm"
          done

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mathmetic-installers-${{ matrix.os }}
          path: |
            out/make/*.exe
            out/make/*.dmg
            out/make/*.deb
            out/make/*.rpm

      - name: Create Git tag for Release
        if: startsWith(github.event.head_commit.message, 'Release') || github.event.inputs.release == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.set-version.outputs.VERSION }}"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists remotely, skipping"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Create GitHub Release and upload assets
        if: startsWith(github.event.head_commit.message, 'Release') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.set-version.outputs.VERSION }}
          name: Mathmetic v${{ steps.set-version.outputs.VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            out/make/*.exe
            out/make/*.dmg
            out/make/*.deb
            out/make/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}