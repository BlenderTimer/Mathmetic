name: Build Installers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish installers to GitHub Release?'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build installers
        run: npm run make

      - name: Set VERSION
        id: set-version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_ENV
      
      - name: Rename Windows installer
        if: matrix.os == 'windows-latest'
        run: |
          mv out/make/squirrel.windows/x64/*.exe out/make/mathmetic-v${{ env.VERSION }}.exe

      - name: Rename macOS installer
        if: matrix.os == 'macos-latest'
        run: |
          mv out/make/*.dmg out/make/mathmetic-v${{ env.VERSION }}.dmg

      - name: Rename Linux installers
        if: matrix.os == 'ubuntu-latest'
        run: |
          shopt -s nullglob
          for f in out/make/deb/x64/*.deb; do
            mv "$f" "out/make/mathmetic-v${{ env.VERSION }}.deb"
          done
          for f in out/make/rpm/x64/*.rpm; do
            mv "$f" "out/make/mathmetic-v${{ env.VERSION }}.rpm"
          done

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mathmetic-installers
          path: |
            out/make/*.exe
            out/make/*.dmg
            out/make/*.deb
            out/make/*.rpm

      - name: Set release mode
        shell: bash
        run: |
          echo "RELEASE=false" >> $GITHUB_ENV
          if [ "${{ github.event.inputs.release }}" == "true" ]; then
            echo "RELEASE=true" >> $GITHUB_ENV
          fi

      - name: Create Git tag for release
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Tag v${{ env.VERSION }} already exists"
          else
            git tag -a "v${{ env.VERSION }}" -m "Release v${{ env.VERSION }}"
            git push origin "v${{ env.VERSION }}"
          fi

      - name: Create GitHub release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Mathmetic v${{ env.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            out/make/*.exe
            out/make/*.dmg
            out/make/*.deb
            out/make/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}